# The Lock-Keeper's Night - task runner (https://taskfile.dev)
version: '3'

vars:
  PROFILE: '{{ .PROFILE | default "debug" }}'
  PROFILE_FLAG: '{{ if eq .PROFILE "release" }}--release{{ end }}'
  PROFILE_DIR: '{{ if eq .PROFILE "release" }}release{{ else }}debug{{ end }}'
  # `cargo install ifiction-cli`, or point it at a checkout:
  # IFICTION="cargo run -q --manifest-path ../../ifiction/Cargo.toml -p ifiction-cli --"
  IFICTION: '{{ .IFICTION | default "ifiction" }}'

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  run:
    desc: Play the game (PROFILE=release for a release build)
    cmds:
      - cargo run {{.PROFILE_FLAG}} -- {{.CLI_ARGS}}

  build:
    desc: Build the game
    cmds:
      - cargo build {{.PROFILE_FLAG}}

  test:
    desc: Run the tests
    cmds:
      - cargo test

  fmt:
    desc: Format the sources
    cmds:
      - cargo fmt

  lint:
    desc: Clippy, warnings as errors
    cmds:
      - cargo clippy --all-targets -- -D warnings

  check:
    desc: Format check, clippy and tests (run before you call it done)
    cmds:
      - cargo fmt --check
      - task: lint
      - task: test

  shot:
    desc: 'Play commands and save a screenshot: task shot -- out.png "w;examine boots"'
    deps: [build]
    cmds:
      - target/{{.PROFILE_DIR}}/lock-keeper --shot {{.CLI_ARGS}}

  dist:
    desc: Build the single-file release binary and verify its Treaty of Babel metadata
    cmds:
      - task: build
        vars: { PROFILE: release }
      - '{{.IFICTION}} ifid target/release/lock-keeper'
      - '{{.IFICTION}} lint target/release/lock-keeper'

  fonts:
    desc: 'Rebake assets/fonts: task fonts -- CAVEAT_FILES_DIR NEWSREADER_FILES_DIR'
    cmds:
      - python3 -I tools/bake_fonts.py {{.CLI_ARGS}} assets/fonts
